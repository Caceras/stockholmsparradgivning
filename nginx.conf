# Stockholms Parrådgivning – static site
map $arg_p $wp_shortlink {
  default "";
  203 /;           198 /parsamtal/;       293 /kommunal-familjeradgivning/;
  321 /familjeradgivning/;  341 /handledning/;  346 /om-oss/;   359 /boka-tid/;
  456 /psykoterapi/;  500 /taby/;  516 /efter-familjeradgivning/;  520 /familjesamtal/;
  575 /huddinge/;  583 /haninge/;  587 /sollentuna/;  622 /nacka/;  633 /solna/;
  668 /stockholms-stad/;  674 /lidingo/;
}

# Keep preview/staging hosts out of Google; the real domain gets no header
map $host $robots_tag {
  default "noindex, nofollow";
  ~*^(www\.)?stockholmsparradgivning\.se$ "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header X-Robots-Tag $robots_tag always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Old WordPress shortlinks (?p=123) -> real pages
  if ($wp_shortlink) { return 301 $wp_shortlink; }

  # Old / moved URLs
  location = /kontakta-oss { return 301 /boka-tid/; }
  location = /kontakta-oss/ { return 301 /boka-tid/; }
  location = /kontakt/ { return 301 /boka-tid/; }
  location = /wp-sitemap.xml { return 301 /sitemap-index.xml; }
  location ~ ^/wp-sitemap { return 301 /sitemap-index.xml; }
  location ~ ^/(feed|comments/feed|author|category)(/|$) { return 301 /; }
  location ~ ^/wp-content/uploads/ { return 301 /; }
  # WordPress no longer exists: tell bots it's gone
  location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-includes|wp-content) { return 410; }

  # Long cache for fingerprinted assets and fonts
  location /_astro/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options "nosniff" always; }
  location /fonts/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; add_header Access-Control-Allow-Origin "*"; }

  # Pages: add trailing slash, serve directory index
  location / {
    try_files $uri $uri/index.html $uri/ =404;
    add_header Cache-Control "public, max-age=600, must-revalidate";
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
  location ~ ^([^.?]*[^/])$ { if (-d $document_root$1) { return 301 $1/; } try_files $uri =404; }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
